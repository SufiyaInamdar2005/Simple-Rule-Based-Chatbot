<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyBot – Rule-Based Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="chat" aria-label="Chatbot">
    <header class="chat__header">
      <div>
        <h1>PyBot</h1>
        <p>Ask me anything. Type “bye” to finish. <span id="mode" class="mode">Checking…</span></p>
      </div>
      <button id="restart" class="ghost" type="button">New chat</button>
    </header>

    <div id="log" class="chat__log" role="log" aria-live="polite"></div>

    <div id="chips" class="chips" aria-label="Suggestions">
      <button type="button">Hello</button>
      <button type="button">What time is it?</button>
      <button type="button">Explain how a hash map works</button>
      <button type="button">Tell me a joke</button>
      <button type="button">What’s the date today?</button>
    </div>

    <form id="form" class="chat__form" autocomplete="off">
      <label for="input" class="sr-only">Your message</label>
      <input id="input" type="text" maxlength="500" placeholder="Type a message…" autofocus>
      <button type="submit">Send</button>
    </form>
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
